# ═══════════════════════════════════════════════════════════════
# CONFIGURAÇÃO ETL CMED → Power BI
# Ajuste os valores conforme seu ambiente antes da primeira execução.
# ═══════════════════════════════════════════════════════════════

# URL oficial da ANVISA/CMED
url_cmed: "https://www.gov.br/anvisa/pt-br/assuntos/medicamentos/cmed/precos"

# Diretórios (caminhos relativos ao diretório do script, ou absolutos)
diretorio_saida: "dados/processed"
diretorio_raw: "dados/raw"
diretorio_historico: "dados/historico"
diretorio_log: "logs"

# Parâmetros de rede
timeout_segundos: 90
tentativas_max: 3
intervalo_retry_segundos: 30
user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

# Alertas por e-mail (preencher para ativar)
email_alerta:
  ativo: false
  smtp_host: "smtp.gmail.com"
  smtp_porta: 587
  remetente: ""
  senha: ""                          # Use variável de ambiente ou App Password
  destinatarios:
    - 
