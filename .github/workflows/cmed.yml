name: ETL CMED Mensal

on:
  schedule:
    - cron: "0 11 1 * *"
    - cron: "0 11 5 * *"
    - cron: "0 11 10 * *"
    - cron: "0 11 15 * *"
  workflow_dispatch:

permissions:
  contents: write

# Evita que duas execuções (crons próximos + dispatch manual) rodem juntas
# e briguem no git push.
concurrency:
  group: etl-cmed
  cancel-in-progress: false

jobs:
  executar-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar diretórios
        run: mkdir -p dados/raw dados/processed/fato logs .github/cmed

      - name: Executar ETL CMED
        env:
          # Só necessários se você ativar alertas por e-mail via Secrets.
          EMAIL_ALERTA_ATIVO: ${{ secrets.EMAIL_ALERTA_ATIVO }}
          SMTP_REMETENTE: ${{ secrets.SMTP_REMETENTE }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          SMTP_DESTINATARIOS: ${{ secrets.SMTP_DESTINATARIOS }}
        run: python etl_cmed.py

      - name: Salvar arquivos gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Versiona apenas os dados processados (Parquet + dimensões) e o estado.
          # Os .xlsx crus, logs e histórico ficam de fora via .gitignore.
          git add dados/processed .github/cmed/estado.json 2>/dev/null || true

          # Trava de segurança: aborta se algo com mais de 100 MB entrou no stage.
          GRANDES=$(git diff --cached --name-only | while read f; do
            [ -f "$f" ] && sz=$(stat -c%s "$f" 2>/dev/null || echo 0) || sz=0
            [ "$sz" -gt 104857600 ] && echo "$f ($sz bytes)"
          done)
          if [ -n "$GRANDES" ]; then
            echo "::error::Arquivo(s) acima de 100MB no commit — abortando:"
            echo "$GRANDES"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
            exit 0
          fi

          git commit -m "Atualização CMED automática ($(date -u +%Y-%m-%d))"

          # Push resiliente: se o branch avançou, faz rebase e tenta de novo.
          for tentativa in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Push concluído."
              exit 0
            fi
            echo "Push falhou (tentativa ${tentativa}/3). Repetindo em 5s..."
            sleep 5
          done

          echo "Falha ao dar push após 3 tentativas." >&2
          exit 1
