name: ETL Lista DCB

on:
  schedule:
    # Toda segunda-feira às 11:00 UTC (08:00 de Brasília). A ANVISA publica
    # novas versões da lista sem calendário fixo; se não houver versão nova,
    # o script termina sem alterar nada.
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      forcar:
        description: "Reprocessar mesmo sem versão nova"
        type: boolean
        default: false

permissions:
  contents: write

# Mesmo grupo de concorrência do ETL CMED: os dois fazem push no mesmo
# branch, então nunca rodam ao mesmo tempo.
concurrency:
  group: etl-cmed
  cancel-in-progress: false

jobs:
  executar-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar ETL DCB
        working-directory: dcb
        env:
          EMAIL_ALERTA_ATIVO: ${{ secrets.EMAIL_ALERTA_ATIVO }}
          SMTP_REMETENTE: ${{ secrets.SMTP_REMETENTE }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
          SMTP_DESTINATARIOS: ${{ secrets.SMTP_DESTINATARIOS }}
        run: |
          if [ "${{ inputs.forcar }}" = "true" ]; then
            python etl_dcb.py --forcar
          else
            python etl_dcb.py
          fi

      - name: Salvar arquivos gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Versiona os dados processados, a planilha original vigente e o estado.
          # Logs ficam de fora via .gitignore.
          git add dcb/dados dcb/estado.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
            exit 0
          fi

          VERSAO=$(python -c "import json;print(json.load(open('dcb/estado.json',encoding='utf-8')).get('versao',''))")
          git commit -m "Atualização Lista DCB automática: ${VERSAO} ($(date -u +%Y-%m-%d))"

          # Push resiliente: se o branch avançou, faz rebase e tenta de novo.
          for tentativa in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Push concluído."
              exit 0
            fi
            echo "Push falhou (tentativa ${tentativa}/3). Repetindo em 5s..."
            sleep 5
          done

          echo "Falha ao dar push após 3 tentativas." >&2
          exit 1
