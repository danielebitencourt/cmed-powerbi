name: Validação CMED (fonte oficial)

on:
  push:
    branches: ["validacao-cmed-*"]
    paths: ["validacao/validar_contra_cmed.py", ".github/workflows/validacao.yml", "validacao/competencia.txt"]
  workflow_dispatch:
    inputs:
      competencia:
        description: "Competência (AAAA-MM)"
        required: true

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Validar contra listas oficiais CMED
        run: |
          COMP="${{ github.event.inputs.competencia }}"
          [ -z "$COMP" ] && COMP="$(cat validacao/competencia.txt)"
          mkdir -p dados/raw logs
          python validacao/validar_contra_cmed.py --competencia "$COMP"
      - name: Salvar resultado no branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validacao/resultado 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Resultado da validação CMED [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
